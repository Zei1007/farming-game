name: Build Android APK

# Runs on GitHub's own build servers (which have full internet access and
# the Android SDK preinstalled) — that's what makes this work when a local
# sandbox can't reach Google's package repos. Push to main to build the
# default "open" (full-content) variant, or run this manually from the
# Actions tab and pick "store" to build the app-store-safe reskin instead
# (see src/config/buildTarget.ts and the README).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Which build target to compile"
        required: true
        default: "open"
        type: choice
        options:
          - open
          - store

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Pick build script
        id: mode
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "store" ]; then
            echo "script=build:store" >> "$GITHUB_OUTPUT"
            echo "label=store" >> "$GITHUB_OUTPUT"
          else
            echo "script=build" >> "$GITHUB_OUTPUT"
            echo "label=open" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web bundle (${{ steps.mode.outputs.label }} mode)
        run: npm run ${{ steps.mode.outputs.script }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync web bundle into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bahay-kubo-rush-${{ steps.mode.outputs.label }}-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
